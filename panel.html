<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adalya Paneli</title>
<style>
:root {
  --bg: #f4f3ef; --card: #ffffff; --soft: #efede6; --line: #e0ddd4; --text: #2b2a27; --muted: #75736c; --side: #fbfaf7;
  --ok: #3b6d11; --ok-bg: #eaf3de; --warn: #854f0b; --warn-bg: #faeeda; --bad: #a32d2d; --bad-bg: #fcebeb;
  --pin-ok: #639922; --pin-warn: #ba7517; --pin-bad: #e24b4a; --pin-unk: #888780; --accent: #185fa5; --accent-bg: #e6f1fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b19; --card: #252523; --soft: #30302d; --line: #3a3a36; --text: #ecebe6; --muted: #a3a19a; --side: #20201e;
    --ok: #97c459; --ok-bg: #27370f; --warn: #efb05a; --warn-bg: #3d2b0d; --bad: #f09595; --bad-bg: #4a1d1d;
    --accent: #85b7eb; --accent-bg: #0c2c4a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 4px 10px 14px; }
.brand b { font-size: 16px; display: block; }
.brand span { color: var(--muted); font-size: 12px; }
.navgroup { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 12px 10px 4px; }
nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14px; }
nav a:hover { background: var(--soft); }
nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nb { font-size: 11px; padding: 0 7px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.sidefoot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.memorial { font-family: Georgia, "Times New Roman", serif; font-size: 14px; color: var(--text); margin-top: 10px; }
main { padding: 22px 26px 40px; max-width: 1280px; width: 100%; }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 21px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pin-ok); display: inline-block; flex: none; }
.dot.bad { background: var(--pin-bad); } .dot.warn { background: var(--pin-warn); } .dot.unk { background: var(--pin-unk); }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.metric .l { color: var(--muted); font-size: 12px; } .metric .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card > h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
button, .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { background: var(--soft); }
button.primary, .btn.primary { background: var(--text); color: var(--card); border-color: var(--text); }
button.primary:hover, .btn.primary:hover { opacity: .88; }
button.on { background: var(--soft); border-color: var(--muted); }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
textarea { width: 100%; min-height: 80px; resize: vertical; }
label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
.form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.form > div { display: flex; flex-direction: column; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
.okmsg { color: var(--ok); font-size: 13px; margin-top: 8px; }
.hint { font-size: 12px; color: var(--muted); }
.info { background: var(--accent-bg); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; } tr.row:hover td, tr.sel td { background: var(--soft); }
.tablewrap { overflow-x: auto; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; display: inline-block; }
.pill.ok { background: var(--ok-bg); } .pill.warn { background: var(--warn-bg); } .pill.bad { background: var(--bad-bg); } .pill.unk { background: var(--soft); color: var(--muted); }
.mono { font-family: Consolas, ui-monospace, monospace; font-size: 12px; }
.empty { padding: 22px; color: var(--muted); text-align: center; }
.list { border: 1px solid var(--line); border-radius: 8px; max-height: 460px; overflow: auto; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; } .li.click { cursor: pointer; } .li.click:hover { background: var(--soft); }
.li .t { color: var(--muted); white-space: nowrap; font-size: 12px; }
svg.map { width: 100%; height: auto; display: block; touch-action: none; }
#bigMap svg.map { height: calc(100vh - 250px); min-height: 420px; }
#mapCard:fullscreen { margin: 0; border-radius: 0; padding: 16px 20px; display: flex; flex-direction: column; background: var(--card); }
#mapCard:fullscreen #bigMap { flex: 1; min-height: 0; }
#mapCard:fullscreen #bigMap svg.map { height: 100%; min-height: 0; }
#mapCard:fullscreen .hint.plan-hint { display: none; }
@media (prefers-color-scheme: light) { image.plan { mix-blend-mode: multiply; } }
.pin { cursor: pointer; } .editing .pin { cursor: grab; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 14px; }
.fact { background: var(--soft); border-radius: 8px; padding: 8px 10px; } .fact .l { color: var(--muted); font-size: 12px; } .fact .v { font-weight: 600; word-break: break-all; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
.tile:hover { border-color: var(--muted); }
.frame { aspect-ratio: 16 / 9; background: #2f3337; display: flex; align-items: center; justify-content: center; color: #c9c7c0; font-size: 12px; position: relative; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; }
.big { margin-bottom: 16px; }
.big .frame { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cards3 .card { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.cards3 .card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
.prose { max-width: 820px; font-size: 14.5px; line-height: 1.65; }
.prose p { margin: 0 0 10px; } .prose ul, .prose ol { margin: 0 0 10px; padding-left: 20px; } .prose li { margin-bottom: 4px; }
.timeline { border-left: 2px solid var(--line); margin: 6px 0 4px 6px; padding-left: 16px; }
.timeline div { margin-bottom: 10px; position: relative; }
.timeline div::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.memcard { display: flex; gap: 28px; align-items: center; padding: 26px; flex-wrap: wrap; }
.memphoto { width: 240px; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; flex: none; background: var(--soft); }
.memphoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.memtext { flex: 1; min-width: 240px; font-family: Georgia, "Times New Roman", serif; }
.memname { font-size: 30px; line-height: 1.2; }
.memdates { color: var(--muted); font-size: 16px; margin-top: 6px; }
.memprof { font-size: 16px; margin-top: 2px; }
.memnote { font-size: 17px; line-height: 1.6; margin-top: 16px; white-space: pre-wrap; }
.memby { color: var(--muted); font-size: 14px; margin-top: 16px; font-family: "Segoe UI", system-ui, sans-serif; }
.photoprev { width: 160px; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--soft); flex: none; }
.photoprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.labelrow { display: flex; gap: 8px; margin-bottom: 6px; } .labelrow input { flex: 1; }
iframe.nvr { width: 100%; height: 75vh; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login .card { width: 100%; max-width: 380px; padding: 26px; }
.login input { width: 100%; margin-bottom: 12px; }
.login .memorial { text-align: center; margin-top: 18px; color: var(--muted); }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; } .navgroup { display: none; }
  .sidefoot { display: none; } .grid2 { grid-template-columns: minmax(0, 1fr); }
  main { padding: 16px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const S = { me: null, status: null, page: "genel", sel: null, editing: false, dragging: null, live: { order: [], i: 0, big: null } };
let timers = [];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = ts => { const d = new Date(ts * 1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dmhm = ts => { const d = new Date(ts * 1000); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + " sn"; if (s < 3600) return Math.round(s / 60) + " dk"; return Math.floor(s / 3600) + " sa " + Math.round((s % 3600) / 60) + " dk"; };
const size = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? Math.round(n / 1e6) + " MB" : Math.round(n / 1e3) + " KB";
const TYPE_TR = { camera: "Kamera", router: "Router", switch: "Switch", nvr: "NVR", repeater: "Tekrarlayıcı", ap: "Access point" };
const isAdmin = () => S.me?.user?.role === "admin";
const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
const trDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : ""; };
function trGen(name) {
  name = (name || "").trim(); if (!name) return "";
  const vs = [...name.toLocaleLowerCase("tr")].filter(c => "aıoueiöü".includes(c));
  const v = { a: "ı", ı: "ı", o: "u", u: "u", e: "i", i: "i", ö: "ü", ü: "ü" }[vs[vs.length - 1] || "e"];
  return name + "'" + ("aıoueiöü".includes(name.slice(-1).toLocaleLowerCase("tr")) ? "n" : "") + v + "n";
}
const site = () => S.me?.site || { site_name: "Adalya sitesi", memorial: { name: "" }, labels: [] };
const memLine = () => site().memorial.name ? trGen(site().memorial.name) + " anısına" : "";
const lifeSpan = m => [trDate(m.birth), trDate(m.death)].filter(Boolean).join(" – ");
const every = (fn, ms) => timers.push(setInterval(fn, ms));
const qsel = (ch) => cams().map(c => `<option value="${c.channel}" ${String(c.channel) === String(ch) ? "selected" : ""}>${esc(c.name)} · kanal ${c.channel}</option>`).join("");

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch {}
  if (r.status === 401 && !path.startsWith("/api/login")) { S.me.user = null; boot(); throw new Error("Giriş gerekli"); }
  if (!r.ok) throw new Error(data?.error || "HTTP " + r.status);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

function level(d) { if (d.up === null) return "unk"; if (d.up === false) return "bad"; return d.drops_today > 0 ? "warn" : "ok"; }
function statusText(d) {
  if (d.up === null) return "Bekleniyor";
  if (d.up === false) return "Kapalı · " + dur(S.status.now - d.since);
  return d.drops_today > 0 ? "Açık · kararsız" : "Açık";
}
const visible = () => (S.status?.devices || []).filter(d => !d.hidden);
const cams = () => visible().filter(d => d.type === "camera" && d.channel).sort((a, b) => a.channel - b.channel);
const pinColor = l => ({ ok: "var(--pin-ok)", warn: "var(--pin-warn)", bad: "var(--pin-bad)", unk: "var(--pin-unk)" }[l]);

/* ------------------------------------------------------------------ shell */

const NAV = [
  ["İzleme", [["genel", "Genel bakış"], ["canli", "Canlı izleme"], ["kameralar", "Kameralar"], ["harita", "Site haritası"], ["ag", "Ağ cihazları"]]],
  ["Kayıt ve kanıt", [["kayitlar", "Kayıtlar"], ["olaylar", "Olaylar ve loglar"], ["disa", "Dışa aktar"]]],
  ["Yönetim", [["bakim", "Bakım günlüğü"], ["nvr", "NVR arayüzü"], ["ayarlar", "Ayarlar"]]],
  ["Hakkında", [["proje", "Proje"]]],
];

function shell() {
  $("#root").innerHTML = `
  <div class="app">
    <aside>
      <div class="brand"><b id="brandName">${esc(site().site_name)}</b><span>Kamera ve ağ yönetimi</span></div>
      <nav>${NAV.map(([g, items]) => `<div class="navgroup">${g}</div>` + items.map(([id, label]) =>
        `<a href="#/${id}" data-nav="${id}"><span>${label}</span><span class="nbslot" data-badge="${id}"></span></a>`).join("")).join("")}</nav>
      <div class="sidefoot">
        <div>${esc(S.me.user.name)} · ${S.me.user.role === "admin" ? "Yönetici" : "Görevli"}${S.me.demo ? ' · <span class="badge">Demo</span>' : ""}</div>
        ${S.me.demo ? "" : '<a href="#" id="logout">Çıkış yap</a>'}
        <a class="memorial" id="sideMemorial" href="#/proje" style="text-decoration:none;display:block">${esc(memLine())}</a>
      </div>
    </aside>
    <main id="main"></main>
  </div>`;
  const lo = $("#logout");
  if (lo) lo.onclick = async e => { e.preventDefault(); await post("/api/logout"); S.me.user = null; boot(); };
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [p, q] = h.split("?");
  return { page: PAGES[p] ? p : "genel", params: new URLSearchParams(q || "") };
}

function render() {
  timers.forEach(clearInterval); timers = [];
  S.editing = false; S.live.big = null;
  const { page, params } = parseHash();
  S.page = page;
  $$("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === page));
  const main = $("#main");
  main.innerHTML = "";
  PAGES[page].render(main, params);
  window.scrollTo(0, 0);
}

function head(title, sub, right = "") {
  return `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
    <div class="live">${right}${S.me.demo ? '<span class="badge">Demo verisi</span>' : ""}<span class="dot" id="liveDot"></span><span id="liveText">${S.status ? "Canlı · " + hm(S.status.now) : "Bağlanıyor…"}</span></div></div>`;
}

async function poll() {
  try {
    S.status = await api("/api/status");
    const ld = $("#liveDot"), lt = $("#liveText");
    if (ld) { ld.className = "dot"; lt.textContent = "Canlı · " + hm(S.status.now); }
    const down = visible().filter(d => d.type === "camera" && d.up === false).length;
    const b = $('[data-badge="kameralar"]');
    if (b) b.innerHTML = down ? `<span class="nb">${down}</span>` : "";
    const nb = $('[data-badge="nvr"]');
    if (nb) nb.innerHTML = S.status.nvr.connected ? "" : '<span class="nb">!</span>';
    if (!S.dragging) PAGES[S.page].onStatus?.();
  } catch (e) {
    const ld = $("#liveDot"), lt = $("#liveText");
    if (ld) { ld.className = "dot bad"; lt.textContent = "Panel sunucusuna ulaşılamıyor"; }
  }
}

/* ------------------------------------------------------------------ shared parts */

function mapSVG(opts = {}) {
  const st = S.status;
  const plan = st?.has_plan && S.planAspect;
  const ih = plan ? 90 / S.planAspect : 90, iy = plan ? (90 - ih) / 2 : 0;
  const vb = plan ? `-2 ${(iy - 2).toFixed(2)} 94 ${(ih + 4).toFixed(2)}` : "-10 -6 110 102";
  let s = `<svg class="map" id="${opts.id || "map"}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Site haritası">`;
  if (plan) s += `<image class="plan" href="/site-plan.png?v=${S.planVer}" x="0" y="${iy.toFixed(2)}" width="90" height="${ih.toFixed(2)}" preserveAspectRatio="none"/>`;
  else for (let i = 10; i < 90; i += 10) s += `<line x1="${i}" y1="0" x2="${i}" y2="90" stroke="var(--line)" stroke-width="0.2"/><line x1="0" y1="${i}" x2="90" y2="${i}" stroke="var(--line)" stroke-width="0.2"/>`;
  if (!plan) s += '<rect x="0" y="0" width="90" height="90" fill="none" stroke="var(--muted)" stroke-width="0.4" stroke-dasharray="1.5 1"/>';
  if (!plan) {
    s += '<text x="45" y="-2" font-size="2.6" text-anchor="middle" fill="var(--muted)">Kuzey</text><text x="45" y="95" font-size="2.6" text-anchor="middle" fill="var(--muted)">Güney</text>';
    s += '<text x="-2" y="46" font-size="2.6" text-anchor="end" fill="var(--muted)">Batı</text><text x="92" y="46" font-size="2.6" fill="var(--muted)">Doğu</text>';
  }
  (site().labels || []).forEach((l, i) => {
    s += `<g class="pin lbl" data-label="${i}"><text x="${l.x}" y="${l.y}" font-size="3.2" font-weight="600" text-anchor="middle" fill="var(--text)" stroke="var(--card)" stroke-width="0.9" paint-order="stroke" style="letter-spacing:.02em">${esc(l.text)}</text></g>`;
  });
  for (const d of visible()) {
    if (d.x == null || d.y == null) continue;
    const c = pinColor(level(d)), sel = S.sel === d.ip;
    const ring = sel ? 'stroke="var(--text)" stroke-width="0.7"' : 'stroke="var(--card)" stroke-width="0.5"';
    const shape = d.type === "camera" ? `<circle cx="${d.x}" cy="${d.y}" r="${sel ? 2.4 : 1.9}" fill="${c}" ${ring}/>`
      : `<rect x="${d.x - 1.7}" y="${d.y - 1.7}" width="3.4" height="3.4" rx="0.5" fill="${c}" ${ring}/>`;
    s += `<g class="pin" data-pin="${d.ip}"><title>${esc(d.name)} · ${d.ip} · ${esc(statusText(d))}</title>${shape}</g>`;
    if (sel || opts.labels) s += `<text x="${d.x}" y="${d.y - 3.2}" font-size="${sel ? 2.6 : 2}" text-anchor="middle" fill="var(--text)" pointer-events="none">${esc(d.name)}</text>`;
  }
  return s + "</svg>";
}
const legend = `<div class="legend"><span><i style="background:var(--pin-ok)"></i>Çalışıyor</span><span><i style="background:var(--pin-warn)"></i>Bugün koptu</span><span><i style="background:var(--pin-bad)"></i>Kapalı</span><span><i style="background:var(--pin-unk);border-radius:2px"></i>Ağ cihazı (kare)</span></div>`;

function eventsHTML(list, limit) {
  if (!list.length) return '<div class="empty">Son 24 saatte kopma yok.</div>';
  return list.slice(0, limit).map(e => {
    const live = e.up_at === null;
    return `<div class="li click" data-goto="${e.ip}"><span class="${live ? "bad" : "warn"}">${esc(e.name)} ${live ? "kapalı" : "koptu"} · ${dur(e.seconds)}</span><span class="t">${hm(e.down_at)}${live ? "" : "–" + hm(e.up_at)}</span></div>`;
  }).join("");
}

function nvrMissing(what) {
  return `<div class="card"><div class="empty">${what} için NVR bağlantısı gerekli.<br><br>${isAdmin() ? '<a class="btn primary" href="#/ayarlar">Ayarlar\'dan NVR\'ye bağlan</a>' : "Yöneticiden NVR bağlantısını açmasını isteyin."}</div></div>`;

    $("#namesBtn").onclick = () => { S.showNames = !S.showNames; $("#namesBtn").classList.toggle("on", S.showNames); this.draw(); };
    $("#fsBtn").onclick = () => {
      const card = $("#mapCard");
      if (document.fullscreenElement) document.exitFullscreen();
      else if (card.requestFullscreen) card.requestFullscreen().catch(() => {});
    };
    document.onfullscreenchange = () => { const b = $("#fsBtn"); if (b) b.textContent = document.fullscreenElement ? "Tam ekrandan çık" : "Tam ekran"; };
    if ($("#editBtn")) $("#editBtn").onclick = () => {
      S.editing = !S.editing;
      $("#editBtn").classList.toggle("on", S.editing);
      $("#editBtn").textContent = S.editing ? "Düzenlemeyi bitir" : "Haritayı düzenle";
      $("#mapCard").classList.toggle("editing", S.editing);
      $("#editHint").style.display = S.editing ? "" : "none";
    };
    this.draw();
  },
  onStatus() { if ($("#bigMap")) this.draw(); },
  draw() {
    $("#bigMap").innerHTML = mapSVG({ id: "map", labels: S.showNames || S.editing });
    const svg = $("#map");
    $$("#map [data-pin]").forEach(p => p.onclick = () => { if (!S.editing) { S.sel = p.dataset.pin; location.hash = "#/kameralar"; } });
    const pt = e => { const q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; return q.matrixTransform(svg.getScreenCTM().inverse()); };
    const target = () => S.dragging.startsWith("label:") ? site().labels[+S.dragging.slice(6)] : S.status.devices.find(x => x.ip === S.dragging);
    svg.onpointerdown = e => {
      if (!S.editing) return;
      const g = e.target.closest("[data-pin],[data-label]"); if (!g) return;
      S.dragging = g.dataset.pin || "label:" + g.dataset.label; svg.setPointerCapture(e.pointerId); e.preventDefault();
    };
    svg.onpointermove = e => {
      if (!S.dragging) return;
      const p = pt(e), d = target(); d.x = Math.max(0, Math.min(90, p.x)); d.y = Math.max(0, Math.min(90, p.y));
      const k = S.dragging; S.dragging = null; this.draw(); S.dragging = k;
    };
    svg.onpointerup = async () => {
      if (!S.dragging) return; const k = S.dragging, d = target(); S.dragging = null;
      try {
        if (k.startsWith("label:")) { const r = await post("/api/site", { labels: site().labels }); S.me.site = r.site; }
        else await post("/api/position", { ip: d.ip, x: d.x, y: d.y });
      } catch (e) { alert("Konum kaydedilemedi: " + e.message); }
    };
  },
};

              <div style="flex:1;min-width:200px"><label for="mBy">Hazırlayan</label><input id="mBy" value="${esc(m.created_by)}"></div>
            </div>
            <label for="mNote" style="margin-top:10px">Anma notu</label><textarea id="mNote" style="min-height:110px">${esc(m.note)}</textarea>
            <div style="margin-top:10px"><button class="primary" id="mSave">Kaydet</button> <a class="btn" href="#/proje">Proje sayfasını gör</a></div>
            <div class="err" id="mErr"></div><div class="okmsg" id="mOk"></div>
          </div>
        </div></div>

      <div class="card"><h2>Site ve harita</h2>
        <div class="form">
          <div style="flex:1;min-width:200px"><label for="sName">Site adı</label><input id="sName" value="${esc(site().site_name)}"></div>
          <div style="flex:2;min-width:260px"><label for="sSup">Teknik destek iletişimi</label><input id="sSup" value="${esc(site().support_contact)}" placeholder="Ad Soyad · 05xx xxx xx xx"></div>
        </div>
        <h3>Harita etiketleri</h3>
        <div class="hint" style="margin-bottom:6px">Blok, bahçe, havuz gibi adlar. Konumlarını Site haritası → Haritayı düzenle ile sürükleyin.</div>
        <div id="lList"></div>
        <button id="lAdd">Etiket ekle</button>
        <div style="margin-top:12px"><button class="primary" id="sSave">Kaydet</button></div>
        <div class="err" id="sErr"></div><div class="okmsg" id="sOk"></div></div>` : "") + `

      <div class="card"><h2>Şifrem <small>${esc(me.name)} · ${esc(me.username)}</small></h2>
        ${S.me.demo ? '<div class="hint">Demo modunda şifre yok.</div>' : `
        <div class="form"><div><label for="pCur">Mevcut şifre</label><input id="pCur" type="password" autocomplete="current-password"></div>
          <div><label for="pNew">Yeni şifre</label><input id="pNew" type="password" autocomplete="new-password" placeholder="en az 8 karakter"></div>
          <button id="pGo">Değiştir</button></div>
        <div class="err" id="pErr"></div><div class="okmsg" id="pOk"></div>`}</div>

      <div class="card"><h2>Hakkında</h2><div class="prose"><p>Adalya Paneli ${esc(S.me.version)} · ${S.me.demo ? "demo modu" : S.me.lan ? "site ağına açık" : "yalnızca bu bilgisayar"}<br>
        Veriler panel klasöründe tutulur: geçmiş ve kullanıcılar <span class="mono">data</span> klasöründe, anma bölümü ve harita <span class="mono">site.json</span> ve <span class="mono">media</span> klasöründe.</p></div></div>`;

    const msg = (id, t) => { const e = $(id); if (e) e.textContent = t; };
    if ($("#pGo")) $("#pGo").onclick = async () => {
      msg("#pErr", ""); msg("#pOk", "");
      if (!$("#pCur").value) { msg("#pErr", "Mevcut şifreyi yazın."); return; }
      if ($("#pNew").value.length < 8) { msg("#pErr", "Yeni şifre en az 8 karakter olmalı."); return; }
      try { await post("/api/me/password", { current: $("#pCur").value, new: $("#pNew").value }); msg("#pOk", "Şifreniz değişti."); $("#pCur").value = $("#pNew").value = ""; } catch (e) { msg("#pErr", e.message); }
    };
    if (!A) return;

    if ($("#nGo")) $("#nGo").onclick = async () => {
      msg("#nErr", "");
      if (!$("#nPass").value) { msg("#nErr", "Şifreyi yazın."); return; }
      $("#nGo").disabled = true; $("#nGo").textContent = "Bağlanıyor…";
      try { await post("/api/nvr/connect", { host: $("#nHost").value.trim(), user: $("#nUser").value.trim(), password: $("#nPass").value }); await poll(); this.render(el); }
      catch (e) { msg("#nErr", e.message); $("#nGo").disabled = false; $("#nGo").textContent = "Bağlan"; }
    };
    if ($("#nOff")) $("#nOff").onclick = async () => { await post("/api/nvr/disconnect"); await poll(); this.render(el); };

    let editing = null;
    const resetForm = () => {
      editing = null; $("#uFormTitle").textContent = "Yeni kullanıcı"; $("#uSave").textContent = "Ekle"; $("#uCancel").style.display = "none";
      $("#uUser").disabled = false; ["#uName", "#uUser", "#uPw"].forEach(s => $(s).value = ""); $("#uRole").value = "staff"; $("#uPw").placeholder = "en az 8 karakter";
    };
    const loadUsers = async () => {
      try {
        const r = await api("/api/users");
        $("#uList").innerHTML = `<div class="tablewrap"><table><thead><tr><th>Ad soyad</th><th>Kullanıcı adı</th><th>Rol</th><th></th></tr></thead><tbody>
          ${r.users.map(u => `<tr><td>${esc(u.name)}${u.username === me.username ? ' <span class="hint">(siz)</span>' : ""}</td><td class="mono">${esc(u.username)}</td><td>${u.role === "admin" ? "Yönetici" : "Görevli"}</td>
            <td style="text-align:right;white-space:nowrap"><button data-edit="${esc(u.username)}">Düzenle</button>${u.username === me.username ? "" : ` <button data-del="${esc(u.username)}">Sil</button>`}</td></tr>`).join("")}</tbody></table></div>`;
        $$("[data-edit]").forEach(b => b.onclick = () => {
          const u = r.users.find(x => x.username === b.dataset.edit); editing = u.username;
          $("#uFormTitle").textContent = "Kullanıcıyı düzenle: " + u.username; $("#uSave").textContent = "Kaydet"; $("#uCancel").style.display = "";
          $("#uName").value = u.name; $("#uUser").value = u.username; $("#uUser").disabled = true; $("#uRole").value = u.role; $("#uPw").value = ""; $("#uPw").placeholder = "boş bırakılırsa değişmez";
          $("#uName").focus();
        });
        $$("[data-del]").forEach(b => b.onclick = async () => {
          if (!confirm(b.dataset.del + " kullanıcısı silinsin mi? Bu kişi artık giriş yapamaz.")) return;
          msg("#uErr", ""); msg("#uOk", "");
          try { await post("/api/users/delete", { username: b.dataset.del }); msg("#uOk", "Kullanıcı silindi."); loadUsers(); } catch (e) { msg("#uErr", e.message); }
        });
      } catch (e) { $("#uList").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    $("#uCancel").onclick = resetForm;
    $("#uSave").onclick = async () => {
      msg("#uErr", ""); msg("#uOk", "");
      const body = { name: $("#uName").value.trim(), username: $("#uUser").value.trim().toLowerCase(), role: $("#uRole").value, password: $("#uPw").value };
      if (!body.name) { msg("#uErr", "Ad soyad yazın."); return; }
      if (!/^[a-z0-9._-]{2,32}$/.test(body.username)) { msg("#uErr", "Kullanıcı adı: küçük harf, rakam, nokta veya tire; 2–32 karakter."); return; }
      if ((!editing || body.password) && body.password.length < 8) { msg("#uErr", "Şifre en az 8 karakter olmalı."); return; }
      try { await post("/api/users", body); msg("#uOk", editing ? "Kullanıcı güncellendi." : "Kullanıcı eklendi. Kullanıcı adı ve şifreyi kişiye iletin."); resetForm(); loadUsers(); } catch (e) { msg("#uErr", e.message); }
    };
    loadUsers();

    const prev = () => { const i = $("#mPrev"); i.style.objectPosition = `${$("#mPx").value}% ${$("#mPy").value}%`; };
    $("#mPx").oninput = prev; $("#mPy").oninput = prev;
    $("#mPick").onclick = () => $("#mFile").click();
    $("#mFile").onchange = () => {
      const f = $("#mFile").files[0]; msg("#mErr", ""); msg("#mOk", "");
      if (!f) return;
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { msg("#mErr", "Fotoğraf JPG, PNG veya WEBP olmalı."); return; }
      if (f.size > 8e6) { msg("#mErr", "Fotoğraf en fazla 8 MB olabilir."); return; }
      const rd = new FileReader();
      rd.onload = async () => {
        try { const r = await post("/api/memorial/photo", { data: rd.result }); S.me.site = r.site; const i = $("#mPrev"); i.src = "/media/memorial?v=" + encodeURIComponent(r.site.memorial.photo); i.style.display = ""; msg("#mOk", "Fotoğraf yüklendi."); }
        catch (e) { msg("#mErr", e.message); }
      };
      rd.readAsDataURL(f);
    };
    $("#mSave").onclick = async () => {
      msg("#mErr", ""); msg("#mOk", "");
      if ($("#mBirth").value && $("#mDeath").value && $("#mBirth").value > $("#mDeath").value) { msg("#mErr", "Doğum tarihi vefat tarihinden önce olmalı."); return; }
      try {
        const r = await post("/api/site", { memorial: { name: $("#mName").value.trim(), birth: $("#mBirth").value, death: $("#mDeath").value, profession: $("#mProf").value.trim(), created_by: $("#mBy").value.trim(), note: $("#mNote").value, photo_x: +$("#mPx").value, photo_y: +$("#mPy").value } });
        S.me.site = r.site; $("#sideMemorial").textContent = memLine(); msg("#mOk", "Kaydedildi.");
      } catch (e) { msg("#mErr", e.message); }
    };

    let labels = (site().labels || []).map(l => ({ ...l }));
    const drawLabels = () => {
      $("#lList").innerHTML = labels.map((l, i) => `<div class="labelrow"><input data-li="${i}" value="${esc(l.text)}" maxlength="30"><button data-ldel="${i}" aria-label="Etiketi sil">Sil</button></div>`).join("") || '<div class="hint" style="margin-bottom:6px">Etiket yok.</div>';
      $$("[data-li]").forEach(inp => inp.oninput = () => { labels[+inp.dataset.li].text = inp.value; });
      $$("[data-ldel]").forEach(b => b.onclick = () => { labels.splice(+b.dataset.ldel, 1); drawLabels(); });
    };
    drawLabels();
    $("#lAdd").onclick = () => { labels.push({ text: "Yeni etiket", x: 45, y: 45 }); drawLabels(); $$("[data-li]").pop().select(); };
    $("#sSave").onclick = async () => {
      msg("#sErr", ""); msg("#sOk", "");
      if (labels.some(l => !l.text.trim())) { msg("#sErr", "Boş etiket var; yazın veya silin."); return; }
      try {
        const r = await post("/api/site", { site_name: $("#sName").value.trim(), support_contact: $("#sSup").value.trim(), labels });
        S.me.site = r.site; labels = r.site.labels.map(l => ({ ...l })); drawLabels(); $("#brandName").textContent = site().site_name; msg("#sOk", "Kaydedildi.");
      } catch (e) { msg("#sErr", e.message); }
    };
  },
};

/* ------------------------------------------------------------------ login and boot */

function loginView() {
  const setup = S.me.setup_needed, m = site().memorial;
  $("#root").innerHTML = `<div class="login"><div class="card">
    <h1 style="margin-bottom:4px">${esc(site().site_name)}</h1><div class="sub" style="margin-bottom:18px">${setup ? "İlk kurulum: ilk yönetici hesabını oluşturun" : "Kamera ve ağ yönetim paneli"}</div>
    ${setup ? '<label for="lFull">Ad soyad</label><input id="lFull" autocomplete="name" placeholder="Ali Kadir Bulut">' : ""}
    <label for="lUser">Kullanıcı adı</label><input id="lUser" autocomplete="username" placeholder="${setup ? "ali" : ""}" autocapitalize="off">
    <label for="lPw">${setup ? "Şifre (en az 8 karakter)" : "Şifre"}</label><input id="lPw" type="password" autocomplete="${setup ? "new-password" : "current-password"}">
    ${setup ? '<label for="lPw2">Şifre tekrar</label><input id="lPw2" type="password" autocomplete="new-password">' : ""}
    <button class="primary" id="lGo" style="width:100%;justify-content:center">${setup ? "Hesabı oluştur ve gir" : "Giriş yap"}</button>
    <div class="err" id="lErr"></div>
    ${m.name ? `<div class="memorial">${esc(memLine())}${lifeSpan(m) ? `<div class="hint" style="margin-top:2px">${esc(lifeSpan(m))}</div>` : ""}</div>` : ""}</div></div>`;
  const go = async () => {
    const username = $("#lUser").value.trim().toLowerCase(), pw = $("#lPw").value;
    $("#lErr").textContent = "";
    if (setup) {
      const name = $("#lFull").value.trim();
      if (!name) { $("#lErr").textContent = "Ad soyad yazın."; return; }
      if (!/^[a-z0-9._-]{2,32}$/.test(username)) { $("#lErr").textContent = "Kullanıcı adı: küçük harf, rakam, nokta veya tire; 2–32 karakter."; return; }
      if (pw.length < 8) { $("#lErr").textContent = "Şifre en az 8 karakter olmalı."; return; }
      if (pw !== $("#lPw2").value) { $("#lErr").textContent = "Şifreler aynı değil."; return; }
      try { await post("/api/setup", { name, username, password: pw }); boot(); } catch (e) { $("#lErr").textContent = e.message; }
      return;
    }
    if (!username || !pw) { $("#lErr").textContent = "Kullanıcı adı ve şifreyi yazın."; return; }
    try { await post("/api/login", { username, password: pw }); boot(); } catch (e) { $("#lErr").textContent = e.message; }
  };
  $("#lGo").onclick = go;
  $$("#root input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
  (setup ? $("#lFull") : $("#lUser")).focus();
}

let polling = null;
async function boot() {
  try { S.me = await (await fetch("/api/me")).json(); } catch { $("#root").innerHTML = '<div class="login"><div class="card"><div class="err">Panel sunucusuna ulaşılamıyor.</div></div></div>'; return; }
  if (!S.me.user) { clearInterval(polling); polling = null; loginView(); return; }
  shell();
  await poll();
  if (S.status?.has_plan && !S.planAspect) {
    S.planVer = S.status.plan_ver || Date.now();
    await new Promise(res => { const im = new Image(); im.onload = () => { S.planAspect = im.naturalWidth / im.naturalHeight || 1; res(); }; im.onerror = res; im.src = "/site-plan.png?v=" + S.planVer; });
  }
  render();
  if (!polling) polling = setInterval(poll, 3000);
}
window.addEventListener("hashchange", () => { if (S.me?.user) render(); });
boot();
</script>
</body>
</html>
