<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adalya Paneli</title>
<style>
:root {
  --bg: #f4f3ef; --card: #ffffff; --soft: #efede6; --line: #e0ddd4; --text: #2b2a27; --muted: #75736c; --side: #fbfaf7;
  --ok: #3b6d11; --ok-bg: #eaf3de; --warn: #854f0b; --warn-bg: #faeeda; --bad: #a32d2d; --bad-bg: #fcebeb;
  --pin-ok: #639922; --pin-warn: #ba7517; --pin-bad: #e24b4a; --pin-unk: #888780; --accent: #185fa5; --accent-bg: #e6f1fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b19; --card: #252523; --soft: #30302d; --line: #3a3a36; --text: #ecebe6; --muted: #a3a19a; --side: #20201e;
    --ok: #97c459; --ok-bg: #27370f; --warn: #efb05a; --warn-bg: #3d2b0d; --bad: #f09595; --bad-bg: #4a1d1d;
    --accent: #85b7eb; --accent-bg: #0c2c4a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 4px 10px 14px; }
.brand b { font-size: 16px; display: block; }
.brand span { color: var(--muted); font-size: 12px; }
.navgroup { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 9px 10px 5px; margin-top: 2px; width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
.navgroup:hover { background: var(--soft); color: var(--text); }
.navgroup svg { width: 10px; height: 10px; transition: transform .15s; }
.navsec.open > .navgroup svg { transform: rotate(90deg); }
.navsec > .navitems { display: none; }
.navsec.open > .navitems { display: block; }
nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 14px; }
nav a:hover { background: var(--soft); }
nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nb { font-size: 11px; padding: 0 7px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.sidefoot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.memorial { font-family: Georgia, "Times New Roman", serif; font-size: 14px; color: var(--text); margin-top: 10px; }
main { padding: 22px 26px 40px; max-width: 1280px; width: 100%; }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 21px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pin-ok); display: inline-block; flex: none; }
.dot.bad { background: var(--pin-bad); } .dot.warn { background: var(--pin-warn); } .dot.unk { background: var(--pin-unk); }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.metric .l { color: var(--muted); font-size: 12px; } .metric .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card > h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
button, .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { background: var(--soft); }
button.primary, .btn.primary { background: var(--text); color: var(--card); border-color: var(--text); }
button.primary:hover, .btn.primary:hover { opacity: .88; }
button.on { background: var(--soft); border-color: var(--muted); }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
textarea { width: 100%; min-height: 80px; resize: vertical; }
label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
.form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.form > div { display: flex; flex-direction: column; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
.okmsg { color: var(--ok); font-size: 13px; margin-top: 8px; }
.hint { font-size: 12px; color: var(--muted); }
.info { background: var(--accent-bg); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; } tr.row:hover td, tr.sel td { background: var(--soft); }
.tablewrap { overflow-x: auto; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; display: inline-block; }
.pill.ok { background: var(--ok-bg); } .pill.warn { background: var(--warn-bg); } .pill.bad { background: var(--bad-bg); } .pill.unk { background: var(--soft); color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.calmon { text-align: left; display: block; width: 100%; padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; font-weight: 400; }
.calmon:hover { background: var(--card); }
.calmon.on { border-color: var(--accent); background: var(--accent-bg); }
.calmon b { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
.calmon .d { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); padding: 1px 0; }
.calmon .d.on { color: var(--text); }
.calmon .d.late { color: var(--bad); }
.calmon .d.soon { color: var(--warn); }
.calmon .d span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calmon .d .n { font-variant-numeric: tabular-nums; flex: none; }
.taskrow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.taskrow:last-child { border-bottom: 0; }
.taskrow .grow { flex: 1; min-width: 0; }
.taskrow.done .grow { opacity: .55; text-decoration: line-through; }
.taskrow .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tpls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mono { font-family: Consolas, ui-monospace, monospace; font-size: 12px; }
.empty { padding: 22px; color: var(--muted); text-align: center; }
.list { border: 1px solid var(--line); border-radius: 8px; max-height: 460px; overflow: auto; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; } .li.click { cursor: pointer; } .li.click:hover { background: var(--soft); }
.li .t { color: var(--muted); white-space: nowrap; font-size: 12px; }
svg.map { width: 100%; height: auto; display: block; touch-action: none; }
#bigMap svg.map { height: calc(100vh - 250px); min-height: 420px; }
#mapCard:fullscreen { margin: 0; border-radius: 0; padding: 16px 20px; display: flex; flex-direction: column; background: var(--card); }
#mapCard:fullscreen #bigMap { flex: 1; min-height: 0; }
#mapCard:fullscreen #bigMap svg.map { height: 100%; min-height: 0; }
#mapCard:fullscreen .hint.plan-hint { display: none; }
@media (prefers-color-scheme: light) { image.plan { mix-blend-mode: multiply; } }
.pin { cursor: pointer; } .editing .pin { cursor: grab; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend svg { width: 16px; height: 16px; vertical-align: -4px; margin-right: 4px; }
.legend .sep { width: 1px; height: 14px; background: var(--line); }
#bigMap, #miniMap { position: relative; }
#miniMap svg.map { height: calc(100vh - 230px); min-height: 440px; max-height: 900px; }
.mapcard { position: absolute; z-index: 3; width: 250px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .22); padding: 10px 12px; font-size: 13px; }
.mapcard .mc-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.mapcard .mc-h b { font-size: 14px; line-height: 1.3; }
.mapcard .mc-x { border: 0; padding: 0 4px; background: none; font-size: 18px; line-height: 1; color: var(--muted); }
.mapcard dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 10px; }
.mapcard dt { color: var(--muted); } .mapcard dd { margin: 0; }
.mapcard .mc-b { display: flex; gap: 6px; flex-wrap: wrap; }
main.wide { max-width: none; }
.bulkbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.livebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); min-width: 40px; justify-content: center; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--text); color: var(--card); }
.livebar .grow { flex: 1; }
#liveWrap:fullscreen { background: #111; padding: 8px; color: #eee; }
#liveWrap:fullscreen .livebar button, #liveWrap:fullscreen .livebar .seg { background: #222; color: #eee; border-color: #444; }
#liveWrap:fullscreen .livebar .seg button.on { background: #eee; color: #111; }
#liveWrap:fullscreen .hint { color: #aaa; }
#liveStage { position: relative; }
#liveGrid { display: grid; gap: 6px; justify-content: center; align-content: center; height: 100%; }
.ltile { position: relative; background: #2f3337; border-radius: 6px; overflow: hidden; cursor: pointer; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; color: #c9c7c0; font-size: 12px; }
.ltile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ltile:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.ltile .lcap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 6px; align-items: center; padding: 10px 7px 3px; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); color: #fff; font-size: 12px; white-space: nowrap; }
.ltile .lcap > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.ltile .lcap .ch { opacity: .8; display: inline-flex; align-items: center; gap: 5px; }
.ltile.small .lcap { font-size: 11px; padding: 8px 5px 2px; }
#liveBig { position: absolute; inset: 0; background: #111; border-radius: 8px; overflow: hidden; display: none; z-index: 2; }
#liveBig img { width: 100%; height: 100%; object-fit: contain; display: block; }
#liveBig .bigbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 18px; background: linear-gradient(rgba(0, 0, 0, .75), transparent); color: #fff; }
#liveBig .bigbar .btn, #liveBig .bigbar button { background: rgba(0, 0, 0, .5); color: #fff; border-color: rgba(255, 255, 255, .35); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 14px; }
.fact { background: var(--soft); border-radius: 8px; padding: 8px 10px; } .fact .l { color: var(--muted); font-size: 12px; } .fact .v { font-weight: 600; word-break: break-all; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
.tile:hover { border-color: var(--muted); }
.frame { aspect-ratio: 16 / 9; background: #2f3337; display: flex; align-items: center; justify-content: center; color: #c9c7c0; font-size: 12px; position: relative; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; }
.big { margin-bottom: 16px; }
.big .frame { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cards3 .card { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.cards3 .card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
.prose { max-width: 820px; font-size: 14.5px; line-height: 1.65; }
.prose p { margin: 0 0 10px; } .prose ul, .prose ol { margin: 0 0 10px; padding-left: 20px; } .prose li { margin-bottom: 4px; }
.timeline { border-left: 2px solid var(--line); margin: 6px 0 4px 6px; padding-left: 16px; }
.timeline div { margin-bottom: 10px; position: relative; }
.timeline div::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.memcard { display: flex; gap: 28px; align-items: center; padding: 26px; flex-wrap: wrap; }
.memphoto { width: 240px; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; flex: none; background: var(--soft); }
.memphoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.memtext { flex: 1; min-width: 240px; font-family: Georgia, "Times New Roman", serif; }
.memname { font-size: 30px; line-height: 1.2; }
.memdates { color: var(--muted); font-size: 16px; margin-top: 6px; }
.memprof { font-size: 16px; margin-top: 2px; }
.memnote { font-size: 17px; line-height: 1.6; margin-top: 16px; white-space: pre-wrap; }
.memby { color: var(--muted); font-size: 14px; margin-top: 16px; font-family: "Segoe UI", system-ui, sans-serif; }
.photoprev { width: 160px; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--soft); flex: none; }
.photoprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.labelrow { display: flex; gap: 8px; margin-bottom: 6px; } .labelrow input { flex: 1; }
iframe.nvr { width: 100%; height: 75vh; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login .card { width: 100%; max-width: 380px; padding: 26px; }
.login input { width: 100%; margin-bottom: 12px; }
.login .memorial { text-align: center; margin-top: 18px; color: var(--muted); }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; } .navgroup { display: none !important; } .navsec, .navsec > .navitems { display: contents !important; }
  .sidefoot { display: none; } .grid2 { grid-template-columns: minmax(0, 1fr); }
  main { padding: 16px; }
}

/* ======================================================================
   2026 UI refresh: calmer type, bigger touch targets, plainer hierarchy.
   Appended as an override layer so older page styles keep working.
   ====================================================================== */
:root {
  --bg: #f7f6f3; --card: #ffffff; --soft: #f1efe9; --line: #e8e5dd; --text: #1b1e23; --muted: #6b7280; --side: #ffffff;
  --ok: #2f7d4f; --ok-bg: #e7f4ec; --warn: #96590a; --warn-bg: #fdf2dc; --bad: #b3261e; --bad-bg: #fbe9e7;
  --pin-ok: #2f9e5f; --pin-warn: #d08a1a; --pin-bad: #d24a44; --pin-unk: #8b8b85;
  --accent: #1d5f8a; --accent-bg: #e9f2f9;
  --r: 14px; --shadow: 0 1px 2px rgba(20, 20, 20, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181a; --card: #1f2225; --soft: #292c30; --line: #33373b; --text: #ecebe6; --muted: #a2a29b; --side: #1b1d1f;
    --ok: #8fce9f; --ok-bg: #1d3327; --warn: #f0bf76; --warn-bg: #3a2c12; --bad: #f09a94; --bad-bg: #45201e;
    --accent: #8ab8df; --accent-bg: #123047;
  }
}
html, body { font-size: 14.5px; }
body { line-height: 1.55; }
h1 { font-size: 25px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 16px; }
h3 { font-size: 14.5px; }
.sub { font-size: 13px; }
.app { grid-template-columns: 238px minmax(0, 1fr); }
aside { padding: 16px 12px; gap: 2px; }
.brand { padding: 4px 8px 16px; display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 15px; }
main { padding: 24px 28px 44px; max-width: 1320px; }
.pagehead { margin-bottom: 18px; }
nav a { padding: 9px 10px; border-radius: 9px; font-size: 14.5px; }
nav a.active { font-weight: 600; }
.navgroup { font-size: 10.5px; letter-spacing: .07em; padding: 10px 10px 5px; }
.sidefoot { font-size: 12px; }
.card { border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.card > h2 { margin-bottom: 12px; }
button, .btn { border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 600; }
button.primary, .btn.primary { background: var(--text); border-color: var(--text); color: var(--card); }
input, select, textarea { border-radius: 10px; padding: 9px 11px; font-size: 14px; }
label { font-size: 12px; font-weight: 500; }
.metrics { gap: 14px; }
.metric { border-radius: 12px; padding: 15px 16px; }
.metric .l { font-size: 13px; }
.metric .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.pill { border-radius: 20px; padding: 2px 9px; font-size: 12px; }
.info, .warnbox { border-radius: 10px; }
.list { border-radius: 12px; }
.li { padding: 11px 14px; }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; padding: 11px 10px; }
td { padding: 11px 10px; font-size: 13.5px; }
.badge { border-radius: 8px; }

/* dashboard */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 15px 16px; }
.stat .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat .l { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat .v { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; }
.stat .v small { font-size: 15px; font-weight: 500; color: var(--muted); }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: start; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-h h2 { margin: 0; }
.card-h a { font-size: 13px; font-weight: 600; }
.ritem { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.ritem:first-of-type { border-top: 0; }
.ritem .grow { flex: 1; min-width: 0; }
.ritem b { font-size: 14px; font-weight: 600; }
.ritem .meta { font-size: 12.5px; color: var(--muted); }
.ico-wrap { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ico-wrap.red { background: var(--bad-bg); color: var(--bad); }
.ico-wrap.amber { background: var(--warn-bg); color: var(--warn); }
.ico-wrap.blue { background: var(--accent-bg); color: var(--accent); }
.ico-wrap.green { background: var(--ok-bg); color: var(--ok); }
.agenda .ag { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.agenda .ag:first-child { border-top: 0; }
.ag .d { width: 40px; flex: none; text-align: center; background: var(--soft); border-radius: 9px; padding: 5px 0; }
.ag .d b { display: block; font-size: 15px; line-height: 1.15; }
.ag .d span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ag .grow { flex: 1; min-width: 0; }
.ag b.t { font-size: 13.5px; font-weight: 600; }
.ag .meta { font-size: 12px; color: var(--muted); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.q { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; text-decoration: none; color: inherit; }
.q:hover { border-color: var(--muted); }
.q .ico-wrap { margin-bottom: 6px; width: 34px; height: 34px; }
.q b { font-size: 14px; font-weight: 600; }
.q span { font-size: 12.5px; color: var(--muted); }
.greet .sub { margin-top: 3px; }
.shift{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.shift{grid-template-columns:minmax(0,1fr)}}
.platebox{display:flex;gap:8px;margin-top:8px}
.platebox input{flex:1;min-width:0;font-size:20px;font-weight:700;letter-spacing:.05em;padding:10px 12px;text-transform:uppercase}
.platebox button{flex:none;padding:10px 14px;font-size:14px}
.platebig{font-size:18px;font-weight:800;letter-spacing:.06em;border:2px solid var(--text);border-radius:7px;padding:2px 9px;display:inline-block}
.feedgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.feedgrid{grid-template-columns:minmax(0,1fr)}}
.feed{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#22261f;color:#b9b7b0}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feed .offline{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;background:repeating-linear-gradient(135deg,#232624,#232624 10px,#1c1f1d 10px,#1c1f1d 20px);color:#d9a3a0}
.feed .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.feed .nm i{width:6px;height:6px;border-radius:50%;background:#6ee7a0;display:inline-block;margin-right:5px}
.feed .nm .bad i{background:#ff8a80}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip.plain{background:var(--soft);color:var(--muted);font-weight:500}
.chip.green{background:var(--ok-bg);color:var(--ok)}
.chip.amber{background:var(--warn-bg);color:var(--warn)}
.chip.red{background:var(--bad-bg);color:var(--bad)}
.chip.blue{background:var(--accent-bg);color:var(--accent)}
.hero{border-radius:18px;padding:22px;background:linear-gradient(155deg,#1d2f28,#27443a);color:#fff;margin-bottom:16px;box-shadow:0 14px 30px -22px rgba(20,45,35,.8)}
.hero .l{font-size:12.5px;opacity:.72}
.hero .v{font-size:38px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .v small{font-size:17px;font-weight:500;opacity:.8}
.hero .split{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hero .split span{border-radius:20px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.12)}
.hero .split .over{background:rgba(255,177,66,.18);color:#ffd08a;font-weight:600}
.hero .due{font-size:12px;opacity:.66;margin-top:9px}
.hero .acts{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.hero .acts button{border-radius:11px;padding:11px 16px;font-size:14px;font-weight:650}
.hero .acts .pay{background:#fff;color:#1d2f28}
.hero .acts .ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22)}
.head-actions{display:flex;align-items:center;gap:10px}

/* resident bottom navigation */
body.has-tabbar main { padding-bottom: 92px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; background: var(--card); border-top: 1px solid var(--line); padding: 6px 6px 8px; }
body.has-tabbar .tabbar { display: flex; }
.tabbar a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); text-decoration: none; padding: 6px 2px; border-radius: 10px; }
.tabbar a.active { color: var(--accent); }
.tabbar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 1150px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat .v { font-size: 24px; }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  main { padding: 16px 14px 88px; }
  .hero .v { font-size: 30px; }
  .platebox input { font-size: 18px; }
}
/* keep the original mobile collapse after the override layer */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; }
  .navgroup { display: none !important; }
  .navsec, .navsec > .navitems { display: contents !important; }
  .sidefoot { display: none; }
  body.has-tabbar aside { display: none; }
  .li { flex-wrap: wrap; }
  .li .t { white-space: normal; text-align: right; overflow-wrap: anywhere; }
}
body { overflow-x: hidden; }
.tabbar { width: 100%; max-width: 100vw; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const S = { me: null, status: null, page: "genel", sel: null, editing: false, dragging: null, live: { order: [], i: 0, big: null } };
let timers = [];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = ts => { const d = new Date(ts * 1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dmhm = ts => { const d = new Date(ts * 1000); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = s => { s = Math.max(0, Math.round(s)); if (s < 60) return s + " sn"; if (s < 3600) return Math.round(s / 60) + " dk"; return Math.floor(s / 3600) + " sa " + Math.round((s % 3600) / 60) + " dk"; };
const size = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? Math.round(n / 1e6) + " MB" : Math.round(n / 1e3) + " KB";
const TYPE_TR = { camera: "Kamera", router: "Router", switch: "Switch", nvr: "NVR", repeater: "Tekrarlayıcı", ap: "Access point" };
const isAdmin = () => S.me?.user?.role === "admin";
const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
const trDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : ""; };
function trGen(name) {
  name = (name || "").trim(); if (!name) return "";
  const vs = [...name.toLocaleLowerCase("tr")].filter(c => "aıoueiöü".includes(c));
  const v = { a: "ı", ı: "ı", o: "u", u: "u", e: "i", i: "i", ö: "ü", ü: "ü" }[vs[vs.length - 1] || "e"];
  return name + "'" + ("aıoueiöü".includes(name.slice(-1).toLocaleLowerCase("tr")) ? "n" : "") + v + "n";
}
const site = () => S.me?.site || { site_name: "Adalya sitesi", memorial: { name: "" }, labels: [] };
const memLine = () => site().memorial.name ? trGen(site().memorial.name) + " anısına" : "";
const lifeSpan = m => [trDate(m.birth), trDate(m.death)].filter(Boolean).join(" – ");
const every = (fn, ms) => timers.push(setInterval(fn, ms));
const qsel = (ch) => cams().map(c => `<option value="${c.channel}" ${String(c.channel) === String(ch) ? "selected" : ""}>${esc(c.name)} · kanal ${c.channel}</option>`).join("");

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch {}
  if (r.status === 401 && !path.startsWith("/api/login")) { S.me.user = null; boot(); throw new Error("Giriş gerekli"); }
  if (!r.ok) throw new Error(data?.error || "HTTP " + r.status);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

function level(d) { if (d.up === null) return "unk"; if (d.up === false) return "bad"; return d.drops_today > 0 ? "warn" : "ok"; }
function statusText(d) {
  if (d.up === null) return "Bekleniyor";
  if (d.up === false) return "Kapalı · " + dur(S.status.now - d.since);
  return d.drops_today > 0 ? "Açık · kararsız" : "Açık";
}
const visible = () => (S.status?.devices || []).filter(d => !d.hidden);
const cams = () => visible().filter(d => d.type === "camera" && d.channel).sort((a, b) => a.channel - b.channel);
const pinColor = l => ({ ok: "var(--pin-ok)", warn: "var(--pin-warn)", bad: "var(--pin-bad)", unk: "var(--pin-unk)" }[l]);

/* ------------------------------------------------------------------ shell */

/* Menu: [group, open by default, items]. Item roles: S = yönetici + güvenlik, A = yalnız yönetici, R = site sakini,
   C = site sakini too, but only when the manager has given their flat at least one camera. */
const NAV = [
  ["Sitem", true, [["dairem", "Dairem", "R"]]],
  ["İzleme", true, [["genel", "Bugün", "S"], ["vardiya", "Vardiya ekranı", "S"], ["canli", "Canlı izleme", "SC"], ["kameralar", "Kameralar", "S"], ["harita", "Site haritası", "SC"]]],
  ["Kayıt ve kanıt", false, [["kayitlar", "Kayıtlar", "S"], ["olaylar", "Olaylar ve loglar", "S"], ["disa", "Dışa aktar", "S"]]],
  ["Sakinler", false, [["sakinler", "Daireler ve kişiler", "S"], ["aidat", "Aidat ve tahsilat", "A"], ["ziyaret", "Ziyaretçi ve araç", "S"], ["mesaj", "Mesaj gönder", "A"], ["talepler", "Talepler", "A"], ["kamerayetki", "Sakin kamera erişimi", "A"]]],
  ["Yönetim", false, [["takvim", "Takvim ve görevler", "A"], ["sozlesmeler", "Sözleşmeler ve poliçeler", "A"], ["belgeler", "Belgeler", "A"], ["bakim", "Bakım günlüğü", "S"]]],
  ["Teknik", false, [["ag", "Ağ cihazları", "S"], ["nvr", "NVR arayüzü", "S"], ["ayarlar", "Ayarlar", "S"]]],
  ["Hakkında", false, [["proje", "Proje", "SR"]]],
];
const ROLE_TR = { admin: "Yönetici", staff: "Güvenlik", resident: "Site sakini" };
const role = () => S.me?.user?.role;
const isResident = () => role() === "resident";
function canSee(page) {
  const it = NAV.flatMap(g => g[2]).find(i => i[0] === page); if (!it) return false;
  const r = role(), need = it[2];
  if (r === "resident") return need.includes("R") || (need.includes("C") && (S.me.user.cams || 0) > 0);
  if (need === "A") return r === "admin";
  return need.includes("S");
}
const NAV_KEY = "adalya.nav.open";
function navOpenState() { let o = {}; try { o = JSON.parse(localStorage.getItem(NAV_KEY) || "{}") || {}; } catch {} return o; }
function setNavOpen(g, v) { const o = navOpenState(); o[g] = v; try { localStorage.setItem(NAV_KEY, JSON.stringify(o)); } catch {} }

function tabbar() {
  if (!isResident()) return "";
  const camsOn = (S.me.user.cams || 0) > 0;
  return `<nav class="tabbar" aria-label="Hızlı menü">
    <a href="#/dairem" data-nav2="dairem"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>Dairem</a>
    ${camsOn ? `<a href="#/canli" data-nav2="canli"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12.5" height="12" rx="2.2"/><path d="m15.5 10.2 5-3v9.6l-5-3"/></svg>Kameralar</a>
    <a href="#/harita" data-nav2="harita"><svg viewBox="0 0 24 24"><path d="m9 4 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>Harita</a>` : ""}
    <a href="#/proje" data-nav2="proje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01"/></svg>Proje</a>
  </nav>`;
}

function shell() {
  const open = navOpenState();
  document.body.classList.toggle("has-tabbar", isResident());
  $("#root").innerHTML = `
  <div class="app">
    <aside>
      <div class="brand"><div style="width:36px;height:36px;border-radius:11px;background:var(--text);color:var(--card);display:grid;place-items:center;font-weight:700;flex:none">A</div><div><b id="brandName">${esc(site().site_name)}</b><span>${isResident() ? "Sakin paneli" : "Site yönetimi"}</span></div></div>
      <nav>${NAV.map(([g, def, items]) => {
        const vis = items.filter(([id]) => canSee(id)); if (!vis.length) return "";
        const isOpen = open[g] ?? def;
        return `<div class="navsec${isOpen ? " open" : ""}" data-sec="${esc(g)}"><button class="navgroup" aria-expanded="${isOpen}"><span>${g}</span><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button><div class="navitems">` +
          vis.map(([id, label]) => `<a href="#/${id}" data-nav="${id}"><span>${label}</span><span class="nbslot" data-badge="${id}"></span></a>`).join("") + "</div></div>";
      }).join("")}</nav>
      <div class="sidefoot">
        <div>${esc(S.me.user.name)} · ${ROLE_TR[role()] || role()}${S.me.demo ? ' · <span class="badge">Demo</span>' : ""}</div>
        ${S.me.demo ? `<label for="demoRole" style="margin-top:8px">Demo: rol olarak görüntüle</label><select id="demoRole" style="width:100%;font-size:13px;padding:4px 6px">${Object.entries(ROLE_TR).map(([k, v]) => `<option value="${k}" ${k === role() ? "selected" : ""}>${v}</option>`).join("")}</select>` : '<a href="#" id="logout">Çıkış yap</a>'}
        <a class="memorial" id="sideMemorial" href="#/proje" style="text-decoration:none;display:block">${esc(memLine())}</a>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  ${tabbar()}`;
  $$(".navsec > .navgroup").forEach(b => b.onclick = () => {
    const sec = b.parentElement, v = !sec.classList.contains("open");
    sec.classList.toggle("open", v); b.setAttribute("aria-expanded", v); setNavOpen(sec.dataset.sec, v);
  });
  const dr = $("#demoRole");
  if (dr) dr.onchange = () => { document.cookie = "adalya_demo_role=" + dr.value + "; path=/; SameSite=Strict"; history.replaceState(null, "", "#/"); boot(); };
  const lo = $("#logout");
  if (lo) lo.onclick = async e => { e.preventDefault(); await post("/api/logout"); S.me.user = null; boot(); };
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [p, q] = h.split("?");
  const home = isResident() ? "dairem" : "genel";
  return { page: PAGES[p] && canSee(p) ? p : home, params: new URLSearchParams(q || "") };
}

function render() {
  timers.forEach(clearInterval); timers = [];
  S.editing = false; S.live.big = null;
  document.onkeydown = null; document.onfullscreenchange = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const { page, params } = parseHash();
  S.page = page;
  $("#main")?.classList.toggle("wide", page === "canli");
  $$("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === page));
  $$("[data-nav2]").forEach(a => a.classList.toggle("active", a.dataset.nav2 === page));
  const sec = $(`[data-nav="${page}"]`)?.closest(".navsec");
  if (sec && !sec.classList.contains("open")) { sec.classList.add("open"); sec.querySelector(".navgroup").setAttribute("aria-expanded", true); }
  const main = $("#main");
  main.innerHTML = "";
  PAGES[page].render(main, params);
  window.scrollTo(0, 0);
}

function head(title, sub, right = "") {
  return `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
    <div class="live">${right}${S.me.demo ? '<span class="badge">Demo verisi</span>' : ""}${isResident() && !(S.me.user.cams > 0) ? "" : `<span class="dot" id="liveDot"></span><span id="liveText">${S.status ? "Canlı · " + hm(S.status.now) : "Bağlanıyor…"}</span>`}</div></div>`;
}

async function poll() {
  if (isResident() && !(S.me.user.cams > 0)) return;
  try {
    S.status = await api(isResident() ? "/api/my/cameras" : "/api/status");
    const ld = $("#liveDot"), lt = $("#liveText");
    if (ld) { ld.className = "dot"; lt.textContent = "Canlı · " + hm(S.status.now); }
    const down = visible().filter(d => d.type === "camera" && d.up === false).length;
    const b = $('[data-badge="kameralar"]');
    if (b) b.innerHTML = down ? `<span class="nb">${down}</span>` : "";
    const nb = $('[data-badge="nvr"]');
    if (nb) nb.innerHTML = S.status.nvr.connected ? "" : '<span class="nb">!</span>';
    if (!S.dragging) PAGES[S.page].onStatus?.();
  } catch (e) {
    const ld = $("#liveDot"), lt = $("#liveText");
    if (ld) { ld.className = "dot bad"; lt.textContent = "Panel sunucusuna ulaşılamıyor"; }
  }
}

/* ------------------------------------------------------------------ shared parts */

function mapSVG(opts = {}) {
  const st = S.status;
  const plan = st?.has_plan && S.planURL;
  const ih = plan ? 90 / S.planAspect : 90;
  S.mapH = ih;
  const vb = plan ? `-1 -1 92 ${(ih + 2).toFixed(2)}` : "-10 -6 110 102";
  let s = `<svg class="map" id="${opts.id || "map"}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Site haritası">`;
  if (plan) s += `<image class="plan" href="${S.planURL}" x="0" y="0" width="90" height="${ih.toFixed(2)}" preserveAspectRatio="none"/>`;
  else for (let i = 10; i < 90; i += 10) s += `<line x1="${i}" y1="0" x2="${i}" y2="90" stroke="var(--line)" stroke-width="0.2"/><line x1="0" y1="${i}" x2="90" y2="${i}" stroke="var(--line)" stroke-width="0.2"/>`;
  if (!plan) s += '<rect x="0" y="0" width="90" height="90" fill="none" stroke="var(--muted)" stroke-width="0.4" stroke-dasharray="1.5 1"/>';
  if (!plan) {
    s += '<text x="45" y="-2" font-size="2.6" text-anchor="middle" fill="var(--muted)">Kuzey</text><text x="45" y="95" font-size="2.6" text-anchor="middle" fill="var(--muted)">Güney</text>';
    s += '<text x="-2" y="46" font-size="2.6" text-anchor="end" fill="var(--muted)">Batı</text><text x="92" y="46" font-size="2.6" fill="var(--muted)">Doğu</text>';
  }
  (site().labels || []).forEach((l, i) => {
    s += `<g class="pin lbl" data-label="${i}" transform="translate(${l.x} ${l.y})"><text font-size="3.2" font-weight="600" text-anchor="middle" fill="var(--text)" stroke="var(--card)" stroke-width="0.9" stroke-linejoin="round" paint-order="stroke" style="letter-spacing:.02em">${esc(l.text)}</text></g>`;
  });
  const placed = visible().filter(d => d.x != null && d.y != null);
  for (const d of placed) {
    const sel = S.sel === d.ip && opts.selRing !== false;
    s += `<g class="pin" data-pin="${d.ip}" transform="translate(${d.x} ${d.y})"><title>${esc(d.name)} · ${TYPE_TR[d.type] || d.type} · ${d.ip} · ${esc(statusText(d))}</title>${pinShape(d.type, pinColor(level(d)), sel)}</g>`;
  }
  if (opts.labels) s += nameLabels(placed, 90, ih);
  return s + "</svg>";
}

/* Device icons: one shape per type (circle = camera, rounded square = network device),
   filled with the status colour, with a white glyph. Symbols live in one hidden sprite. */
const PIN_R = 1.8;
const ICONS = {
  camera: '<rect x="2.5" y="7" width="12.5" height="10" rx="2.2"/><path d="M15 10.6l6-3.2v9.2l-6-3.2z" fill="#fff"/>',
  ap: '<path d="M4.2 9.6a11 11 0 0 1 15.6 0M7.6 13a6.2 6.2 0 0 1 8.8 0"/><circle cx="12" cy="17" r="1.8" fill="#fff" stroke="none"/>',
  router: '<rect x="3" y="12.5" width="18" height="7" rx="1.8"/><path d="M7.5 12.5V5M16.5 12.5V5"/><circle cx="7.5" cy="16" r="1" fill="#fff" stroke="none"/><circle cx="11" cy="16" r="1" fill="#fff" stroke="none"/>',
  switch: '<path d="M4 8.5h15M15.5 5l3.5 3.5-3.5 3.5M20 15.5H5M8.5 12L5 15.5 8.5 19"/>',

/* Name labels for "Cihaz adları": a solid pill per device, placed greedily on the
   side (above, below, right, left, then diagonals) that overlaps the fewest pins and
   already placed labels, and kept inside the map. */
function nameLabels(devs, W, H) {
  const FS = 1.75, PH = 2.7, GAP = 0.5, R = PIN_R;
  const boxes = devs.map(d => ({ x0: d.x - R, y0: d.y - R, x1: d.x + R, y1: d.y + R }));
  const ov = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
  const order = [...devs].sort((a, b) => (S.sel === a.ip ? -1 : 0) - (S.sel === b.ip ? -1 : 0) || a.y - b.y || a.x - b.x);
  let out = '<g class="names" pointer-events="none">';
  for (const d of order) {
    const w = d.name.length * FS * 0.56 + 1.6, hw = w / 2, hh = PH / 2;
    const cands = [
      [d.x, d.y - R - GAP - hh], [d.x, d.y + R + GAP + hh], [d.x + R + GAP + hw, d.y], [d.x - R - GAP - hw, d.y],
      [d.x + R + hw, d.y - R - hh], [d.x - R - hw, d.y - R - hh], [d.x + R + hw, d.y + R + hh], [d.x - R - hw, d.y + R + hh],
    ];
    let best = null;
    for (const [cx0, cy0] of cands) {
      const cx = Math.max(hw, Math.min(W - hw, cx0)), cy = Math.max(hh, Math.min(H - hh, cy0));
      const b = { x0: cx - hw, y0: cy - hh, x1: cx + hw, y1: cy + hh };
      let cost = 0; for (const o of boxes) cost += ov(b, o);
      cost += Math.hypot(cx - cx0, cy - cy0) * 0.5;
      if (!best || cost < best.cost - 1e-6) best = { cost, b, cx, cy };
      if (cost === 0) break;
    }
    boxes.push(best.b);
    out += `<g><rect x="${best.b.x0.toFixed(2)}" y="${best.b.y0.toFixed(2)}" width="${w.toFixed(2)}" height="${PH}" rx="${hh}" fill="var(--card)" fill-opacity="0.93" stroke="var(--line)" stroke-width="0.15"/>
      <text x="${best.cx.toFixed(2)}" y="${(best.cy + FS * 0.35).toFixed(2)}" font-size="${FS}" text-anchor="middle" fill="var(--text)">${esc(d.name)}</text></g>`;
  }
  return out + "</g>";
}
async function preparePlan(rotationOverride) {
  if (!S.status?.has_plan) { S.planURL = null; return; }
  const p = site().plan || {}, rot = rotationOverride ?? (+p.rotation || 0), trim = p.trim_white !== false;
  if (!S.planImg || S.planImgVer !== S.status.plan_ver) {
    S.planImg = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = "/site-plan.png?v=" + (S.status.plan_ver || 0); });
    S.planImgVer = S.status.plan_ver;
  }
  const img = S.planImg; if (!img) { S.planURL = null; return; }
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const r = rot * Math.PI / 180, c = Math.abs(Math.cos(r)), sn = Math.abs(Math.sin(r));
  const W = Math.ceil(w * c + h * sn), H = Math.ceil(w * sn + h * c);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d", { willReadFrequently: true });
  g.translate(W / 2, H / 2); g.rotate(r); g.drawImage(img, -w / 2, -h / 2, w, h); g.setTransform(1, 0, 0, 1, 0, 0);
  const id = g.getImageData(0, 0, W, H), px = id.data, N = W * H;
  if (trim) {
    const bg = i => { const a = px[i * 4 + 3]; if (a < 16) return true; const R = px[i * 4], G = px[i * 4 + 1], B = px[i * 4 + 2]; return R > 226 && G > 226 && B > 226 && Math.max(R, G, B) - Math.min(R, G, B) < 20; };
    const seen = new Uint8Array(N), q = new Int32Array(N); let head = 0, tail = 0;
    const push = i => { if (!seen[i] && bg(i)) { seen[i] = 1; q[tail++] = i; } };
    for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (head < tail) {
      const i = q[head++], x = i % W;
      px[i * 4 + 3] = 0;
      if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < N - W) push(i + W);
    }
    g.putImageData(id, 0, 0);
  }
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    if (px[(y * W + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, out = document.createElement("canvas");
  out.width = cw; out.height = ch;
  out.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
  S.planURL = out.toDataURL("image/webp", 0.92);
  if (!S.planURL.startsWith("data:image/webp")) S.planURL = out.toDataURL("image/png");
  S.planAspect = cw / ch;
}

/* Live view: 8 / 16 / 32 tiles per screen with paging. Snapshots are fetched by one
   scheduler: after the first load of the page, one refresh every LIVE_TICK ms (about
   1.4 per second, whatever the grid size) and never more than LIVE_MAX_INFLIGHT open
   requests, so 32 tiles cost the NVR no more than 8 do; each tile just refreshes less often. */
const LIVE_SIZES = [8, 16, 32], LIVE_KEY = "adalya.live.size", LIVE_MAX_INFLIGHT = 2, LIVE_TICK = 700, BIG_MAX_FPS = 4;
function liveSizeLoad() { try { const v = +localStorage.getItem(LIVE_KEY); return LIVE_SIZES.includes(v) ? v : 16; } catch { return 16; } }
function liveSizeSave(v) { try { localStorage.setItem(LIVE_KEY, String(v)); } catch {} }

/* Card for the selected device on a map: solid background, kept inside the map area. */
function deviceCard(wrap, svg, onClose) {
  const d = visible().find(x => x.ip === S.sel);
  if (!d || d.x == null || d.y == null || !svg) return;
  const l = level(d), m = svg.getScreenCTM(), box = wrap.getBoundingClientRect();
  if (!m) return;
  const sx = d.x * m.a + m.e - box.left, sy = d.y * m.d + m.f - box.top, r = PIN_R * 1.7 * m.a;
  const el = document.createElement("div");
  el.className = "mapcard"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", d.name);
  el.innerHTML = `<div class="mc-h"><b>${esc(d.name)}</b><button class="mc-x" aria-label="Kapat">×</button></div>
    <dl><dt>Tür</dt><dd>${TYPE_TR[d.type] || esc(d.type)}</dd>
      ${isResident() ? "" : `<dt>IP</dt><dd class="mono">${esc(d.ip)}</dd>`}
      ${d.channel ? `<dt>Kanal</dt><dd>${d.channel}</dd>` : ""}
      <dt>Durum</dt><dd><span class="pill ${l}">${esc(statusText(d))}</span></dd>
      ${d.up && d.rtt != null ? `<dt>Ping</dt><dd>${d.rtt} ms</dd>` : ""}
      <dt>Bugün kopma</dt><dd>${d.drops_today}</dd>
      <dt>24 sa erişim</dt><dd>${d.uptime.toFixed(1)}%</dd></dl>
    <div class="mc-b">${d.channel && S.status.nvr.connected ? `<a class="btn${isResident() ? " primary" : ""}" href="#/canli?ch=${d.channel}">Canlı izle</a>` : ""}${isResident() ? "" : '<a class="btn primary" href="#/kameralar">Ayrıntılar</a>'}</div>`;
  wrap.appendChild(el);
  const cw = el.offsetWidth, ch = el.offsetHeight, W = wrap.clientWidth, H = wrap.clientHeight, M = 6;
  let left = sx + r + 10, top = sy - ch / 2;
  if (left + cw > W - M) left = sx - r - 10 - cw;
  if (left < M) { left = Math.max(M, Math.min(W - cw - M, sx - cw / 2)); top = sy - r - 10 - ch; if (top < M) top = sy + r + 10; }
  top = Math.max(M, Math.min(H - ch - M, top));
  el.style.left = left + "px"; el.style.top = top + "px";
  el.querySelector(".mc-x").onclick = e => { e.stopPropagation(); onClose(); };
  el.onclick = e => e.stopPropagation();
}

    stage.style.height = H + "px";

    for (let cols = 1; cols <= N; cols++) {

     arrived (one request at a time, at most BIG_MAX_FPS per second), so a fast NVR gives a near-live
     picture and a slow camera simply gets fewer frames. The grid is paused meanwhile, so the NVR load

    document.onfullscreenchange = () => { const b = $("#fsBtn"); if (b) b.textContent = document.fullscreenElement ? "Tam ekrandan çık" : "Tam ekran"; };

      $("#mapCard").classList.toggle("editing", S.editing);
      $("#editHint").style.display = S.editing ? "" : "none";
      $("#rotRow").style.display = S.editing ? "" : "none";
      this.draw();
    };
    if ($("#rotIn")) {
      let timer = null;
      const apply = (save) => {
        const v = +$("#rotIn").value; $("#rotVal").textContent = v + "°";

        timer = setTimeout(async () => {
          site().plan = { ...(site().plan || {}), rotation: v, trim_white: $("#trimIn").checked };
          await preparePlan(v); this.draw();
          if (save) { try { const r = await post("/api/site", { plan: site().plan }); S.me.site = r.site; } catch (e) { alert("Kaydedilemedi: " + e.message); } }
        }, save ? 0 : 120);
      };
      $("#rotIn").oninput = () => apply(false);
      $("#rotIn").onchange = () => apply(true);
      $("#rotL").onclick = () => { $("#rotIn").value = +$("#rotIn").value - 1; apply(true); };
      $("#rotR").onclick = () => { $("#rotIn").value = +$("#rotIn").value + 1; apply(true); };
      $("#trimIn").onchange = () => apply(true);
    }
    this.draw();
  },
  onStatus() { if ($("#bigMap")) this.draw(); },
  draw() {
    $("#bigMap").innerHTML = mapSVG({ id: "map", labels: S.showNames || S.editing, selRing: !S.editing });
    const svg = $("#map");
    if (!S.editing) deviceCard($("#bigMap"), svg, () => { S.sel = null; this.draw(); });
    svg.onclick = e => {
      if (S.editing) return;
      const p = e.target.closest("[data-pin]");
      const ip = p ? p.dataset.pin : null;
      if (ip === S.sel) return;
      S.sel = ip; this.draw();
    };
    const pt = e => { const q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; return q.matrixTransform(svg.getScreenCTM().inverse()); };
    const target = () => S.dragging.startsWith("label:") ? site().labels[+S.dragging.slice(6)] : S.status.devices.find(x => x.ip === S.dragging);
    let g = null, moved = false;
    svg.onpointerdown = e => {
      if (!S.editing) return;
      g = e.target.closest("[data-pin],[data-label]"); if (!g) return;
      S.dragging = g.dataset.pin || "label:" + g.dataset.label; moved = false;
      svg.setPointerCapture(e.pointerId); e.preventDefault();
      svg.querySelector(".names")?.setAttribute("opacity", "0.25");
    };
    // Move only the dragged group; rebuilding the SVG mid-drag would drop the pointer capture.
    svg.onpointermove = e => {
      if (!S.dragging || !g) return;
      const p = pt(e), d = target(); if (!d) return;
      d.x = +Math.max(0, Math.min(90, p.x)).toFixed(1); d.y = +Math.max(0, Math.min(S.mapH || 90, p.y)).toFixed(1);
      g.setAttribute("transform", `translate(${d.x} ${d.y})`); moved = true;
    };
    const finish = async () => {
      if (!S.dragging) return; const k = S.dragging, d = target(); S.dragging = null; g = null;
      this.draw();
      if (!moved || !d) return;
      try {
        if (k.startsWith("label:")) { const r = await post("/api/site", { labels: site().labels }); S.me.site = r.site; }
        else await post("/api/position", { ip: d.ip, x: d.x, y: d.y });
      } catch (e) { alert("Konum kaydedilemedi: " + e.message); }
    };
    svg.onpointerup = finish; svg.onpointercancel = finish;
  },
};

/* ------------------------------------------------------------------ aidat (dues) */

const TL = n => (+n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
const trDay = s => s ? `${+s.slice(8, 10)} ${MONTHS[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}` : "";
const trPeriod = p => p ? `${MONTHS[+p.slice(5, 7) - 1]} ${p.slice(0, 4)}` : "";
const KIND_CHARGE = { aidat: "Aidat", ek: "Ek ödeme", gecikme: "Gecikme tazminatı" };
async function loadDues() { S.dues = await api("/api/dues"); return S.dues; }
const duesOf = f => S.dues?.flats?.[String(f.id)];
function duesPill(st) {
  if (!st) return '<span class="hint">–</span>';
  if (st.overdue > 0) return `<span class="pill bad">${TL(st.overdue)} gecikmiş · ${st.overdue_count} kalem</span>`;
  if (st.balance > 0) return `<span class="pill warn">${TL(st.balance)} vadesi gelmedi</span>`;
  if (st.balance < 0) return `<span class="pill ok">${TL(-st.balance)} alacaklı</span>`;
  return '<span class="pill ok">Borcu yok</span>';
}
/* Who gets the aidat reminder: tenants if the flat has one (they pay day-to-day), otherwise owners. */
function duesTargets(f) {
  const live = f.people.filter(p => !p.move_out && p.kind !== "hane");
  const ten = live.filter(p => p.kind === "kiraci");
  return ten.length ? ten : live.filter(p => p.kind === "malik");
}
function waNum(ph) { let d = String(ph || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "90" + d.slice(1); else if (d.length === 10 && d.startsWith("5")) d = "90" + d; return d.length >= 11 ? d : ""; }

PAGES.aidat = {
  render(el, params) {
    this.openFlat = +params?.get("flat") || null;
    el.innerHTML = head("Aidat ve tahsilat", "Aylık aidat, ödemeler, gecikenler ve daire hesapları") + `
      <section class="metrics" id="duMetrics"></section>
      <div class="card" id="duLedger" style="display:none"></div>

/* One-click reminder: opens WhatsApp (or e-mail) for the person who pays, with the overdue text filled in. */
function remindBtn(f) { return `<button data-remind="${f.id}" title="Aidat hatırlatması gönder">Hatırlat</button>`; }
function bindRemind(root) {
  $$("[data-remind]", root).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const f = S.reg.find(x => x.id === +b.dataset.remind), t = duesTargets(f), p = t.find(x => waNum(x.phone)) || t.find(x => x.email);
    if (!p) { alert(`${flatName(f)} için telefon veya e-posta kayıtlı değil. Mektup için Mesaj gönder'i kullanın.`); return; }
    const tp = MSG_TEMPLATES.aidat_hatirlatma, msg = fillMsg(tp.text, { p, f });
    const url = waNum(p.phone) ? `https://wa.me/${waNum(p.phone)}?text=${encodeURIComponent(msg)}` : `mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent(tp.subject)}&body=${encodeURIComponent(msg)}`;
    window.open(url, "_blank", "noopener");
    post("/api/messages/log", { channel: waNum(p.phone) ? "WhatsApp" : "e-posta", count: 1, subject: `Aidat hatırlatma · ${flatName(f)}` }).catch(() => {});
    b.textContent = "Hatırlatıldı ✓";
  });
}
/* Bulk actions on selected flats (Aidat page and Daireler ve kişiler). */
function bulkBar(box, ids, done) {
  if (!box) return;
  if (!ids.length) { box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "";
  box.innerHTML = `<b>${ids.length} daire seçili</b>
    <button class="primary" data-bk="remind">Hatırlatma hazırla</button><button data-bk="msg">Mesaj yaz</button>
    <button data-bk="paid">Ödendi işaretle (borcun tamamı)</button><button data-bk="charge">Borç yaz</button><button data-bk="clear">Seçimi temizle</button>`;
  $$("[data-bk]", box).forEach(b => b.onclick = async () => {
    const k = b.dataset.bk;
    if (k === "clear") return done();
    if (k === "remind" || k === "msg") { S.msgPreset = { flat_ids: ids, tpl: k === "remind" ? "aidat_hatirlatma" : "serbest" }; location.hash = "#/mesaj"; return; }
    try {
      if (k === "paid") {
        const date = prompt(`${ids.length} dairenin bugünkü borcunun tamamı ödendi olarak kaydedilsin mi?\nÖdeme tarihi (YYYY-AA-GG):`, ymd(new Date())); if (!date) return;
        const r = await post("/api/dues/pay", { flat_ids: ids, date, method: "havale", note: "Toplu kayıt" });
        alert(`${r.count} daire için toplam ${TL(r.total)} ödeme kaydedildi.`);
      } else {
        const amount = prompt(`${ids.length} daireye yazılacak tutar (TL):`); if (!amount) return;
        const note = prompt("Açıklama (ör. Çatı onarımı payı, gecikme tazminatı):"); if (!note) return;
        const r = await post("/api/dues/charge", { flat_ids: ids, amount, note, kind: /gecikme/i.test(note) ? "gecikme" : "ek" });
        alert(`${r.count} daireye ${TL(amount.replace(",", "."))} borç yazıldı.`);
      }
      done();
    } catch (e) { alert(e.message); }
  });
}

/* Fills {placeholders} for one person and flat. Aidat values come from S.dues (loaded on the Mesaj, Daireler and Aidat pages). */
function fillMsg(text, { p, f }) {
  const s = duesOf(f) || {}, set = S.dues?.settings || {}, now = new Date();
  const cars = f.vehicles.map(v => v.plate + (v.model ? ` (${v.model})` : "")).join(", ") || "kayıtlı araç yok";
  const periods = (s.open || []).filter(o => o.due_date < ymd(now)).map(o => o.kind === "aidat" ? trPeriod(o.period) : (KIND_CHARGE[o.kind] || o.kind));
  const monthly = set.mode === "arsa" ? "" : TL(set.amount);
  const v = {
    ad: p.name, daire: flatName(f), telefon: p.phone || "kayıtlı değil", araclar: cars, site: site().site_name,
    bakiye: TL(s.balance), geciken: TL(s.overdue), geciken_donem: periods.join(", ") || "–", en_eski_vade: trDay(s.oldest_due) || "–",
    gecikme_tazminati: TL(s.late_fee), gecikme_orani: String(set.late_pct ?? 5).replace(".", ","), aidat: monthly || "arsa payınıza göre",
    iban: set.iban || "(IBAN Aidat ayarlarından girilmeli)", hesap: set.account_name || site().site_name + " Yönetimi",
    son_gun: set.due_day || 10, donem: trPeriod(`${now.getFullYear()}-${pad(now.getMonth() + 1)}`),
  };
  return text.replace(/\{([a-z_]+)\}/g, (m, k) => k in v ? v[k] : m);
}

/* ------------------------------------------------------------------ management: calendar, contracts, documents */

const TASK_KIND_TR = { gorev: "Görev", toplanti: "Toplantı", bakim: "Bakım", hukuki: "Hukuki", diger: "Diğer" };
const CONTRACT_KIND_TR = { sigorta: "Sigorta poliçesi", asansor: "Asansör bakım", temizlik: "Temizlik", guvenlik: "Güvenlik", peyzaj: "Peyzaj / bahçe", bakim: "Genel bakım", diger: "Diğer" };
const DOC_KIND_TR = { sozlesme: "Sözleşme", police: "Poliçe", karar: "Karar defteri", plan: "Plan / proje", makbuz: "Makbuz", diger: "Diğer" };
const CONTRACT_STATUS = { valid: ["ok", "Geçerli"], soon: ["warn", "Bitiyor"], expired: ["bad", "Süresi geçti"], none: ["unk", "Tarih yok"] };
const addDays = (day, n) => { const d = new Date(day + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
function dayLeftText(n) { return n == null ? "" : n < 0 ? Math.abs(n) + " gün önce bitti" : n === 0 ? "bugün bitiyor" : n + " gün kaldı"; }
function itemState(it, today) {
  if (it.done) return "done";
  if (it.date < today) return "late";
  return it.date <= addDays(today, 7) ? "soon" : "";
}

PAGES.takvim = {
  year: 0,
  month: undefined,
  data: null,
  render(el) {
    const now = new Date();
    if (!this.year) this.year = now.getFullYear();
    if (this.month === undefined) this.month = this.year === now.getFullYear() ? now.getMonth() + 1 : 1;
    el.innerHTML = head("Takvim ve görevler", "Hukuki tarihler, yıllık işler ve kendi görevleriniz",
      `<button id="calPrev" aria-label="Önceki yıl">‹</button><b id="calYear" style="min-width:4.2em;text-align:center;display:inline-block">${this.year}</b><button id="calNext" aria-label="Sonraki yıl">›</button> <button id="calNow">Bu yıl</button>`) + `
      <div class="info">Bu takvim yöneticiye yardımcı olmak için hazırlanmış bir araçtır; <b>hukuki görüş değildir</b>. Yönetim planı ve avukatınızın görüşü esastır; tarihleri kendi yönetim planınıza göre doğrulayın.</div>
      <div class="card"><h2>Ay ay <small>bir aya tıklayın</small></h2><div class="cal" id="calGrid"></div></div>
      <div class="card"><h2 id="calListTitle">İşler</h2><div id="calList"></div></div>
      <div class="card"><h2>Görev ekle</h2>
        <div class="form">
          <div><label for="tkDate">Tarih</label><input id="tkDate" type="date"></div>
          <div style="flex:1;min-width:220px"><label for="tkTitle">Başlık</label><input id="tkTitle" maxlength="120" placeholder="Örn. Asansör firmasıyla görüş"></div>
          <div><label for="tkKind">Tür</label><select id="tkKind">${Object.entries(TASK_KIND_TR).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
          <div style="flex:1;min-width:200px"><label for="tkNote">Not (isteğe bağlı)</label><input id="tkNote" maxlength="2000"></div>
          <button class="primary" id="tkSave">Ekle</button>
        </div>
        <div class="err" id="tkErr"></div>
        <div class="tpls" id="tkTpl"></div>
      </div>`;
    $("#calPrev").onclick = () => { this.year--; this.load(); };
    $("#calNext").onclick = () => { this.year++; this.load(); };
    $("#calNow").onclick = () => { const d = new Date(); this.year = d.getFullYear(); this.month = d.getMonth() + 1; this.load(); };
    $("#tkSave").onclick = () => this.save();
    this.load();
  },
  items() {
    const d = this.data; if (!d) return [];
    const out = [];
    d.duties.forEach(x => out.push({ ...x, type: "duty" }));
    d.tasks.forEach(x => out.push({ ...x, type: "task" }));
    return out.sort((a, b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title, "tr"));
  },
  async load() {
    $("#calYear").textContent = this.year;
    try { this.data = await api("/api/calendar?year=" + this.year); }
    catch (e) { $("#calList").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    this.templates();
    this.draw();
  },
  templates() {
    const d = this.data;
    $("#tkTpl").innerHTML = '<span class="hint">Hazır görevler:</span> ' +
      (d.templates || []).map(t => `<button data-tpl="${esc(t.key)}">＋ ${esc(t.title)}</button>`).join("");
    $$("#tkTpl [data-tpl]").forEach(b => b.onclick = () => {
      const t = d.templates.find(x => x.key === b.dataset.tpl);
      $("#tkDate").value = t.date; $("#tkTitle").value = t.title; $("#tkKind").value = t.kind;
      $("#tkTitle").focus();
    });
  },
  draw() {
    const today = ymd(new Date()), items = this.items();
    $("#calGrid").innerHTML = MONTHS.map((name, i) => {
      const m = i + 1, mi = items.filter(x => +x.date.slice(5, 7) === m);
      const rows = mi.slice(0, 4).map(x => {
        const st = itemState(x, today);
        return `<span class="d ${st === "done" ? "" : st}"><span>${esc(x.title)}</span><span class="n">${+x.date.slice(8, 10)}</span></span>`;
      }).join("");
      return `<button class="calmon${this.month === m ? " on" : ""}" data-month="${m}"><b>${name} <span class="hint">${mi.length ? mi.length + " iş" : ""}</span></b>${rows || '<span class="d"><span class="hint">–</span></span>'}${mi.length > 4 ? `<span class="d"><span class="hint">+${mi.length - 4} iş</span></span>` : ""}</button>`;
    }).join("");
    $$("#calGrid [data-month]").forEach(b => b.onclick = () => { this.month = +b.dataset.month; this.draw(); });
    const shown = this.month ? items.filter(x => +x.date.slice(5, 7) === this.month) : items;
    const left = shown.filter(x => !x.done && x.date < today).length;
    $("#calListTitle").innerHTML = `${this.month ? MONTHS[this.month - 1] + " " + this.year : this.year + " yılı"} işleri
      <small>${shown.length} kayıt${left ? ` · ${left} gecikmiş` : ""}</small>
      <button id="calAll">${this.month ? "Tüm yıl" : "Bu ay"}</button>`;
    $("#calAll").onclick = () => { this.month = this.month ? null : new Date().getMonth() + 1; this.draw(); };
    $("#calList").innerHTML = shown.length ? shown.map(it => this.row(it, today)).join("") : '<div class="empty">Bu ay için iş yok.</div>';
    $$("#calList [data-done]").forEach(cb => cb.onchange = async () => {
      const [type, key] = cb.dataset.done.split(":");
      try {
        if (type === "task") await post("/api/calendar/task/done", { id: +key, done: cb.checked });
        else await post("/api/calendar/duty", { key, year: this.year, done: cb.checked });
        this.load();
      } catch (e) { cb.checked = !cb.checked; $("#tkErr").textContent = e.message; }
    });
    $$("#calList [data-del]").forEach(b => b.onclick = async () => {
      if (!confirm("Bu görev silinsin mi?")) return;
      try { await post("/api/calendar/task/delete", { id: +b.dataset.del }); this.load(); } catch (e) { $("#tkErr").textContent = e.message; }
    });
  },
  row(it, today) {
    const st = itemState(it, today);
    const pill = it.type === "task"
      ? `<span class="pill unk">${esc(TASK_KIND_TR[it.kind] || it.kind)}</span>`
      : `<span class="pill unk">${esc(it.law)}</span>`;
    const detail = it.type === "duty" && !it.monthly && it.detail ? `<div class="hint">${esc(it.detail)}</div>` : "";
    return `<div class="taskrow ${it.done ? "done" : ""}">
      <input type="checkbox" ${it.done ? "checked" : ""} data-done="${it.type}:${it.type === "task" ? it.id : esc(it.key)}" aria-label="Tamamlandı">
      <div class="grow"><div>${esc(it.title)} ${pill}</div>${it.note ? `<div class="hint">${esc(it.note)}</div>` : ""}${detail}</div>
      <div class="when ${st === "late" ? "bad" : st === "soon" ? "warn" : ""}">${trDate(it.date)}${st === "late" ? " · gecikti" : ""}</div>
      ${it.type === "task" ? `<button data-del="${it.id}" aria-label="Sil">×</button>` : ""}
    </div>`;
  },
  async save() {
    $("#tkErr").textContent = "";
    const body = { date: $("#tkDate").value, title: $("#tkTitle").value.trim(), kind: $("#tkKind").value, note: $("#tkNote").value.trim() };
    if (!body.date) { $("#tkErr").textContent = "Tarih seçin."; return; }
    if (!body.title) { $("#tkErr").textContent = "Başlık yazın."; return; }
    try {
      await post("/api/calendar/task", body);
      $("#tkTitle").value = ""; $("#tkNote").value = "";
      this.year = +body.date.slice(0, 4); this.month = +body.date.slice(5, 7);
      this.load();
    } catch (e) { $("#tkErr").textContent = e.message; }
  },
};

          <div><label for="dcKind">Tür</label><select id="dcKind">${Object.entries(DOC_KIND_TR).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
          <div style="flex:1;min-width:180px"><label for="dcNote">Not</label><input id="dcNote" maxlength="1000"></div>

      </div>

    $("#dcGo").onclick = () => this.upload();

  },
  upload() {
    const f = $("#dcFile").files[0];
    $("#dcErr").textContent = ""; $("#dcOk").textContent = "";
    if (!f) { $("#dcErr").textContent = "Önce bir dosya seçin."; return; }
    if (f.size > 10000000) { $("#dcErr").textContent = "Dosya en fazla 10 MB olabilir."; return; }
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        await post("/api/documents", { name: $("#dcName").value.trim(), kind: $("#dcKind").value, note: $("#dcNote").value.trim(), filename: f.name, data: rd.result });
        $("#dcOk").textContent = "Belge yüklendi.";
        $("#dcFile").value = ""; $("#dcName").value = ""; $("#dcNote").value = "";
        this.load();
      } catch (e) { $("#dcErr").textContent = e.message; }
    };
    rd.onerror = () => { $("#dcErr").textContent = "Dosya okunamadı."; };
    rd.readAsDataURL(f);
  },
  async load() {
    try {
      const r = await api("/api/documents");
      const ds = r.documents;
      $("#dcList").innerHTML = ds.length ? `<div class="tablewrap"><table><thead><tr><th>Ad</th><th>Tür</th><th>Boyut</th><th>Yükleyen</th><th>Tarih</th><th></th></tr></thead><tbody>

        : '<div class="empty">Henüz belge yok. Sözleşmeleri ve poliçeleri buraya yükleyin.</div>';
      $$("#dcList [data-rm]").forEach(b => b.onclick = async () => {
        if (!confirm("Belge silinsin mi? Bağlı sözleşmelerdeki belge bağlantısı da kalkar.")) return;

      });

  },
};
